<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="600" height="680" style="background:#0a0f1d;">
  <defs>
    <linearGradient id="modalBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .font-display { font-family: 'Outfit', 'Inter', system-ui, sans-serif; }
  </style>

  <!-- Modal Container Card -->
  <g id="RegistrationModal" transform="translate(40, 30)">
    <rect width="520" height="620" rx="24" fill="#111827" stroke="#3730a3" stroke-width="1.5"/>

    <!-- Modal Header -->
    <g transform="translate(36, 36)">
      <text x="0" y="22" fill="#ffffff" class="font-display" font-size="22" font-weight="900">
        Register for Event
      </text>
      <text x="0" y="46" fill="#818cf8" class="font-sans" font-size="14" font-weight="700">
        Web Hackathon 2026 (CSE)
      </text>
      <text x="0" y="68" fill="#94a3b8" class="font-sans" font-size="12">
        Fill out attendee credentials to generate verified digital fest pass.
      </text>

      <!-- Close X Button -->
      <g transform="translate(425, 0)">
        <rect width="32" height="32" rx="8" fill="#1e293b"/>
        <text x="16" y="21" text-anchor="middle" fill="#94a3b8" class="font-sans" font-size="14" font-weight="700">✕</text>
      </g>
    </g>

    <line x1="36" y1="125" x2="484" y2="125" stroke="#1f2937"/>

    <!-- FORM INPUTS -->
    <g transform="translate(36, 145)">
      <!-- Field 1: Full Name -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#cbd5e1" class="font-sans" font-size="12" font-weight="600">Student Full Name *</text>
        <rect y="24" width="448" height="46" rx="12" fill="#1e293b" stroke="#334155"/>
        <text x="16" y="53" fill="#ffffff" class="font-sans" font-size="13">Priyadharshini S</text>
        <text x="420" y="53" fill="#10b981" class="font-sans" font-size="14" font-weight="800">✓</text>
      </g>

      <!-- Field 2: Roll Number -->
      <g transform="translate(0, 85)">
        <text x="0" y="14" fill="#cbd5e1" class="font-sans" font-size="12" font-weight="600">College Roll Number *</text>
        <rect y="24" width="448" height="46" rx="12" fill="#1e293b" stroke="#334155"/>
        <text x="16" y="53" fill="#818cf8" class="font-sans" font-size="13" font-weight="700" letter-spacing="1">22CS045</text>
        <text x="420" y="53" fill="#10b981" class="font-sans" font-size="14" font-weight="800">✓</text>
      </g>

      <!-- Field 3: College Email -->
      <g transform="translate(0, 170)">
        <text x="0" y="14" fill="#cbd5e1" class="font-sans" font-size="12" font-weight="600">Institutional Email (@kiot.ac.in) *</text>
        <rect y="24" width="448" height="46" rx="12" fill="#1e293b" stroke="#334155"/>
        <text x="16" y="53" fill="#ffffff" class="font-sans" font-size="13">priyadharshini.s@kiot.ac.in</text>
        <text x="420" y="53" fill="#10b981" class="font-sans" font-size="14" font-weight="800">✓</text>
      </g>

      <!-- Field 4: Mobile Phone -->
      <g transform="translate(0, 255)">
        <text x="0" y="14" fill="#cbd5e1" class="font-sans" font-size="12" font-weight="600">Mobile Phone (10 Digits) *</text>
        <rect y="24" width="448" height="46" rx="12" fill="#1e293b" stroke="#334155"/>
        <text x="16" y="53" fill="#ffffff" class="font-sans" font-size="13">9876543210</text>
        <text x="420" y="53" fill="#10b981" class="font-sans" font-size="14" font-weight="800">✓</text>
      </g>

      <!-- Validation Banner -->
      <g transform="translate(0, 340)">
        <rect width="448" height="34" rx="8" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="1"/>
        <text x="12" y="22" fill="#6ee7b7" class="font-sans" font-size="11" font-weight="600">✓ Institutional identity verified: CSE Department, 3rd Year</text>
      </g>
    </g>

    <!-- Modal Action Buttons -->
    <g transform="translate(36, 545)">
      <rect width="140" height="48" rx="14" fill="#1e293b" stroke="#334155"/>
      <text x="70" y="29" text-anchor="middle" fill="#94a3b8" class="font-sans" font-size="13" font-weight="600">Cancel</text>

      <rect x="156" width="292" height="48" rx="14" fill="url(#modalBtnGrad)"/>
      <text x="302" y="29" text-anchor="middle" fill="#ffffff" class="font-sans" font-size="14" font-weight="700">Confirm Pass (₹200) →</text>
    </g>
  </g>
</svg>
