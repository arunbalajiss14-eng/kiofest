<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" style="background:#0a0f1d;">
  <defs>
    <linearGradient id="primaryBtnDS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .font-display { font-family: 'Outfit', 'Inter', system-ui, sans-serif; }
    .font-mono { font-family: 'SF Mono', 'Courier New', monospace; }
  </style>

  <!-- Sheet Header -->
  <g transform="translate(60, 40)">
