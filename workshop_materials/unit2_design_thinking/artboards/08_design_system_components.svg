    <text x="56" y="24" fill="#ffffff" class="font-display" font-size="24" font-weight="900">
      KIOT FEST 2026 — Master Design System &amp; Component Kit
    </text>
    <text x="56" y="44" fill="#94a3b8" class="font-sans" font-size="13">
      Figma Master Tokens, Reusable Component Variants, and Color Styles for Unit 2 Prototyping
    </text>
  </g>

  <line x1="60" y1="105" x2="1140" y2="105" stroke="#1f2937"/>

  <!-- ================= 1. COLOR TOKENS PALETTE ================= -->
  <g transform="translate(60, 125)">
    <text x="0" y="16" fill="#818cf8" class="font-sans" font-size="12" font-weight="800" letter-spacing="1">1. COLOR PALETTE TOKENS</text>
    
    <!-- Swatch 1: Body Dark -->
    <g transform="translate(0, 30)">
      <rect width="115" height="65" rx="12" fill="#0a0f1d" stroke="#1f2937"/>
