      <text x="10" y="94" fill="#64748b" class="font-mono" font-size="10">#0a0f1d</text>
    </g>

    <!-- Swatch 2: Card Dark -->
    <g transform="translate(130, 30)">
      <rect width="115" height="65" rx="12" fill="#111827" stroke="#1f2937"/>
      <text x="10" y="80" fill="#ffffff" class="font-sans" font-size="11" font-weight="700">Surface Card</text>
      <text x="10" y="94" fill="#64748b" class="font-mono" font-size="10">#111827</text>
    </g>

    <!-- Swatch 3: Primary Indigo -->
    <g transform="translate(260, 30)">
      <rect width="115" height="65" rx="12" fill="#6366f1"/>
      <text x="10" y="80" fill="#ffffff" class="font-sans" font-size="11" font-weight="700">Primary Indigo</text>
      <text x="10" y="94" fill="#64748b" class="font-mono" font-size="10">#6366f1</text>
