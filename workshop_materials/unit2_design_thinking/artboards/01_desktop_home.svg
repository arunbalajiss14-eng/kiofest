<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" width="1440" height="1024" style="background:#0a0f1d;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="primaryBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="heroTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cardImgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .font-display { font-family: 'Outfit', 'Inter', system-ui, sans-serif; }
  </style>

  <!-- Background Decorative Blobs -->
  <circle cx="720" cy="200" r="320" fill="url(#bgGlow)" filter="url(#glassBlur)"/>
  <circle cx="1200" cy="350" r="180" fill="#f59e0b" fill-opacity="0.08" filter="url(#glassBlur)"/>
  <circle cx="200" cy="650" r="220" fill="#6366f1" fill-opacity="0.08" filter="url(#glassBlur)"/>

  <!-- ================= NAVBAR ================= -->
  <g id="Navbar">
    <rect x="0" y="0" width="1440" height="72" fill="#0a0f1d" fill-opacity="0.85"/>
    <line x1="0" y1="72" x2="1440" y2="72" stroke="#1f2937" stroke-width="1"/>

    <g transform="translate(80, 18)">
      <!-- Logo -->
      <rect x="0" y="0" width="36" height="36" rx="10" fill="#6366f1"/>
      <path d="M12 18 L18 12 L24 18 L18 24 Z" fill="#ffffff"/>
      <text x="46" y="24" fill="#ffffff" class="font-display" font-size="18" font-weight="900" letter-spacing="-0.5">KIOT FEST <tspan fill="#818cf8">2026</tspan></text>
      
      <!-- Nav Links -->
      <text x="380" y="23" fill="#ffffff" class="font-sans" font-size="14" font-weight="600">Home</text>
      <line x1="380" y1="32" x2="420" y2="32" stroke="#6366f1" stroke-width="2"/>
      <text x="450" y="23" fill="#94a3b8" class="font-sans" font-size="14" font-weight="500">All Events</text>
      <text x="550" y="23" fill="#94a3b8" class="font-sans" font-size="14" font-weight="500">Schedule</text>
      <text x="645" y="23" fill="#94a3b8" class="font-sans" font-size="14" font-weight="500">My Passes</text>
      <text x="745" y="23" fill="#94a3b8" class="font-sans" font-size="14" font-weight="500">Coordinator</text>

      <!-- Cart Button -->
      <g transform="translate(1120, 0)">
        <rect x="0" y="0" width="140" height="38" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="24" y="24" fill="#e2e8f0" class="font-sans" font-size="13" font-weight="600">Cart</text>
        <rect x="85" y="8" width="22" height="22" rx="11" fill="#6366f1"/>
        <text x="93" y="23" fill="#ffffff" class="font-sans" font-size="11" font-weight="800">2</text>
      </g>
    </g>
  </g>

  <!-- ================= HERO BANNER ================= -->
  <g id="HeroSection" transform="translate(0, 100)">
    <!-- Fest Pill -->
    <g transform="translate(545, 0)">
      <rect x="0" y="0" width="350" height="32" rx="16" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
      <text x="30" y="20" fill="#a5b4fc" class="font-sans" font-size="12" font-weight="600">✨ Annual National Level Inter-College Fest</text>
    </g>

    <!-- Main Heading -->
    <text x="720" y="75" text-anchor="middle" fill="#ffffff" class="font-display" font-size="44" font-weight="900" letter-spacing="-1">
      Unleash Your Innovation at
    </text>
    <text x="720" y="125" text-anchor="middle" fill="url(#heroTextGrad)" class="font-display" font-size="48" font-weight="900" letter-spacing="-1">
      KIOT FEST 2026
    </text>

    <!-- Subtitle -->
    <text x="720" y="165" text-anchor="middle" fill="#94a3b8" class="font-sans" font-size="15" font-weight="400">
      South India's premier symposium of Hackathons, Circuit Debugging, Combat Robotics, AI Masterclasses &amp; Cultural Celebrations.
    </text>

    <!-- Date, Venue, Prize Badges -->
    <g transform="translate(420, 195)">
      <rect x="0" y="0" width="180" height="34" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="16" y="22" fill="#cbd5e1" class="font-sans" font-size="12" font-weight="600">📅 March 25 - 26, 2026</text>

      <rect x="195" y="0" width="180" height="34" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="210" y="22" fill="#cbd5e1" class="font-sans" font-size="12" font-weight="600">📍 KIOT Campus, Salem</text>

      <rect x="390" y="0" width="190" height="34" rx="10" fill="#451a03" stroke="#b45309" stroke-width="1"/>
      <text x="408" y="22" fill="#fcd34d" class="font-sans" font-size="12" font-weight="800">🏆 ₹1,50,000+ Prize Pool</text>
    </g>

    <!-- CTA Buttons -->
    <g transform="translate(520, 250)">
      <rect x="0" y="0" width="200" height="46" rx="14" fill="url(#primaryBtn)"/>
      <text x="40" y="28" fill="#ffffff" class="font-sans" font-size="14" font-weight="700">Explore All Events →</text>

      <rect x="220" y="0" width="180" height="46" rx="14" fill="#1e293b" stroke="#475569"/>
      <text x="250" y="28" fill="#f1f5f9" class="font-sans" font-size="14" font-weight="600">🎟️ Find My Passes</text>
    </g>

    <!-- Countdown Timer -->
    <g transform="translate(490, 315)">
      <g transform="translate(0, 0)">
        <rect width="90" height="60" rx="14" fill="#111827" stroke="#1f2937"/>
        <text x="45" y="36" text-anchor="middle" fill="#ffffff" class="font-display" font-size="24" font-weight="900">08</text>
        <text x="45" y="50" text-anchor="middle" fill="#64748b" class="font-sans" font-size="10" font-weight="700">DAYS</text>
      </g>
      <g transform="translate(110, 0)">
        <rect width="90" height="60" rx="14" fill="#111827" stroke="#1f2937"/>
        <text x="45" y="36" text-anchor="middle" fill="#ffffff" class="font-display" font-size="24" font-weight="900">14</text>
        <text x="45" y="50" text-anchor="middle" fill="#64748b" class="font-sans" font-size="10" font-weight="700">HOURS</text>
      </g>
      <g transform="translate(220, 0)">
        <rect width="90" height="60" rx="14" fill="#111827" stroke="#1f2937"/>
        <text x="45" y="36" text-anchor="middle" fill="#ffffff" class="font-display" font-size="24" font-weight="900">32</text>
        <text x="45" y="50" text-anchor="middle" fill="#64748b" class="font-sans" font-size="10" font-weight="700">MINUTES</text>
      </g>
      <g transform="translate(330, 0)">
        <rect width="90" height="60" rx="14" fill="#111827" stroke="#1f2937"/>
        <text x="45" y="36" text-anchor="middle" fill="#818cf8" class="font-display" font-size="24" font-weight="900">45</text>
        <text x="45" y="50" text-anchor="middle" fill="#64748b" class="font-sans" font-size="10" font-weight="700">SECONDS</text>
      </g>
    </g>
  </g>

  <!-- ================= SEARCH & DEPARTMENT FILTER ================= -->
  <g id="FilterSection" transform="translate(120, 500)">
    <!-- Search Box -->
    <rect x="0" y="0" width="380" height="42" rx="12" fill="#111827" stroke="#1f2937"/>
    <text x="16" y="26" fill="#64748b" class="font-sans" font-size="13">🔍 Search events, workshops, hackathons...</text>

    <!-- Department Pills -->
    <g transform="translate(410, 0)">
      <rect x="0" y="0" width="65" height="42" rx="12" fill="#6366f1"/>
      <text x="20" y="26" fill="#ffffff" class="font-sans" font-size="12" font-weight="700">ALL</text>

      <rect x="75" y="0" width="70" height="42" rx="12" fill="#111827" stroke="#1f2937"/>
      <text x="96" y="26" fill="#94a3b8" class="font-sans" font-size="12" font-weight="600">CSE</text>

      <rect x="155" y="0" width="70" height="42" rx="12" fill="#111827" stroke="#1f2937"/>
      <text x="176" y="26" fill="#94a3b8" class="font-sans" font-size="12" font-weight="600">ECE</text>

      <rect x="235" y="0" width="85" height="42" rx="12" fill="#111827" stroke="#1f2937"/>
      <text x="252" y="26" fill="#94a3b8" class="font-sans" font-size="12" font-weight="600">AI&amp;DS</text>

      <rect x="330" y="0" width="80" height="42" rx="12" fill="#111827" stroke="#1f2937"/>
      <text x="348" y="26" fill="#94a3b8" class="font-sans" font-size="12" font-weight="600">MECH</text>

      <rect x="420" y="0" width="80" height="42" rx="12" fill="#111827" stroke="#1f2937"/>
      <text x="439" y="26" fill="#94a3b8" class="font-sans" font-size="12" font-weight="600">CIVIL</text>

      <rect x="510" y="0" width="60" height="42" rx="12" fill="#111827" stroke="#1f2937"/>
      <text x="532" y="26" fill="#94a3b8" class="font-sans" font-size="12" font-weight="600">IT</text>
    </g>
  </g>

  <!-- ================= EVENT CARDS GRID ================= -->
  <g id="EventGrid" transform="translate(120, 565)">
    <!-- CARD 1: Web Hackathon 2026 (In Cart state) -->
    <g id="Card-CSE" transform="translate(0, 0)">
      <rect width="580" height="380" rx="20" fill="#111827" stroke="#6366f1" stroke-width="1.5"/>
      <!-- Banner Image -->
      <rect width="580" height="150" rx="20" fill="url(#cardImgGrad)"/>
      <rect x="20" y="16" width="60" height="24" rx="12" fill="#4338ca" fill-opacity="0.6"/>
      <text x="35" y="32" fill="#c7d2fe" class="font-sans" font-size="11" font-weight="800">CSE</text>
      <rect x="90" y="16" width="90" height="24" rx="12" fill="#1e293b"/>
      <text x="105" y="32" fill="#94a3b8" class="font-sans" font-size="11" font-weight="600">Hackathon</text>

      <!-- Seats pill -->
      <rect x="20" y="112" width="115" height="24" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="32" y="128" fill="#6ee7b7" class="font-sans" font-size="11" font-weight="700">🟢 5 Seats Left</text>

      <!-- Content -->
      <text x="24" y="185" fill="#ffffff" class="font-display" font-size="18" font-weight="800">Web Hackathon 2026</text>
      <text x="24" y="210" fill="#94a3b8" class="font-sans" font-size="13">Build fullstack web applications using React &amp; Next.js in 6 hours.</text>

      <!-- Metadata -->
      <text x="24" y="245" fill="#cbd5e1" class="font-sans" font-size="12">📅 March 25, 2026   •   ⏰ 09:30 AM   •   📍 CSE Lab 3</text>
      <text x="24" y="275" fill="#fbbf24" class="font-sans" font-size="14" font-weight="800">🏆 Prize Pool: ₹15,000</text>

      <!-- Bottom bar -->
      <line x1="24" y1="305" x2="556" y2="305" stroke="#1f2937"/>
      <text x="24" y="342" fill="#64748b" class="font-sans" font-size="11" font-weight="700">ENTRY FEE</text>
      <text x="24" y="362" fill="#ffffff" class="font-display" font-size="18" font-weight="900">₹200</text>

      <rect x="420" y="326" width="136" height="38" rx="12" fill="#065f46" stroke="#10b981" stroke-width="1"/>
      <text x="450" y="350" fill="#a7f3d0" class="font-sans" font-size="13" font-weight="700">✓ In Cart</text>
    </g>

    <!-- CARD 2: Circuit Debugging (Available state) -->
    <g id="Card-ECE" transform="translate(620, 0)">
      <rect width="580" height="380" rx="20" fill="#111827" stroke="#1f2937"/>
      <!-- Banner Image -->
      <rect width="580" height="150" rx="20" fill="url(#cardImgGrad)"/>
      <rect x="20" y="16" width="60" height="24" rx="12" fill="#0e7490" fill-opacity="0.6"/>
      <text x="35" y="32" fill="#a5f3fc" class="font-sans" font-size="11" font-weight="800">ECE</text>
      <rect x="90" y="16" width="80" height="24" rx="12" fill="#1e293b"/>
      <text x="105" y="32" fill="#94a3b8" class="font-sans" font-size="11" font-weight="600">Technical</text>

      <!-- Seats pill -->
      <rect x="20" y="112" width="120" height="24" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="32" y="128" fill="#6ee7b7" class="font-sans" font-size="11" font-weight="700">🟢 12 Seats Left</text>

      <!-- Content -->
      <text x="24" y="185" fill="#ffffff" class="font-display" font-size="18" font-weight="800">Circuit Debugging Master</text>
      <text x="24" y="210" fill="#94a3b8" class="font-sans" font-size="13">Embedded PCB and microcontroller hardware troubleshooting battle.</text>

      <!-- Metadata -->
      <text x="24" y="245" fill="#cbd5e1" class="font-sans" font-size="12">📅 March 25, 2026   •   ⏰ 11:00 AM   •   📍 ECE VLSI Lab</text>
      <text x="24" y="275" fill="#fbbf24" class="font-sans" font-size="14" font-weight="800">🏆 Prize Pool: ₹8,000</text>

      <!-- Bottom bar -->
      <line x1="24" y1="305" x2="556" y2="305" stroke="#1f2937"/>
      <text x="24" y="342" fill="#64748b" class="font-sans" font-size="11" font-weight="700">ENTRY FEE</text>
      <text x="24" y="362" fill="#ffffff" class="font-display" font-size="18" font-weight="900">₹100</text>

      <rect x="420" y="326" width="136" height="38" rx="12" fill="#6366f1"/>
      <text x="445" y="350" fill="#ffffff" class="font-sans" font-size="13" font-weight="700">+ Register</text>
    </g>
  </g>

  <!-- ================= FOOTER ================= -->
  <g id="Footer" transform="translate(0, 970)">
    <line x1="0" y1="0" x2="1440" y2="0" stroke="#1f2937"/>
    <text x="120" y="32" fill="#64748b" class="font-sans" font-size="12">© 2026 Knowledge Institute of Technology. All Rights Reserved.</text>
    <text x="1200" y="32" fill="#818cf8" class="font-sans" font-size="12" font-weight="600">Student Fest Portal • Unit 2 Design Kit</text>
  </g>
</svg>
