<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 844" width="420" height="844" style="background:#0a0f1d;">
  <defs>
    <linearGradient id="drawerBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .font-display { font-family: 'Outfit', 'Inter', system-ui, sans-serif; }
  </style>

  <!-- Slide-Over Drawer Container -->
  <g id="CartDrawer">
    <rect width="420" height="844" fill="#0f172a" stroke="#1f2937" stroke-width="1.5"/>

    <!-- Drawer Header -->
    <g transform="translate(24, 28)">
      <rect width="36" height="36" rx="10" fill="#312e81"/>
      <text x="11" y="24" fill="#a5b4fc" font-size="16">🛍️</text>

      <text x="48" y="20" fill="#ffffff" class="font-display" font-size="17" font-weight="800">Registration Cart</text>
      <text x="48" y="34" fill="#94a3b8" class="font-sans" font-size="11">2 competitions selected</text>

      <!-- Close X -->
      <g transform="translate(336, 2)">
        <rect width="32" height="32" rx="8" fill="#1e293b"/>
        <text x="16" y="21" text-anchor="middle" fill="#94a3b8" class="font-sans" font-size="14" font-weight="700">✕</text>
      </g>
    </g>

    <line x1="0" y1="84" x2="420" y2="84" stroke="#1f2937"/>

    <!-- CART ITEMS LIST -->
    <g transform="translate(24, 108)">
      <!-- Item 1: Web Hackathon -->
      <g id="CartItem-1" transform="translate(0, 0)">
        <rect width="372" height="110" rx="16" fill="#111827" stroke="#3730a3"/>
        
        <g transform="translate(16, 16)">
          <rect width="45" height="20" rx="6" fill="#312e81"/>
          <text x="12" y="14" fill="#c7d2fe" class="font-sans" font-size="9" font-weight="800">CSE</text>
          <text x="56" y="14" fill="#94a3b8" class="font-sans" font-size="10">Hackathon</text>

          <text x="0" y="42" fill="#ffffff" class="font-display" font-size="14" font-weight="800">Web Hackathon 2026</text>
          
          <text x="0" y="68" fill="#10b981" class="font-sans" font-size="14" font-weight="800">₹200</text>
          <text x="46" y="67" fill="#64748b" class="font-sans" font-size="11">• March 25, 2026</text>

          <!-- Delete Trash Button -->
          <g transform="translate(305, 10)">
            <rect width="28" height="28" rx="6" fill="#1e293b"/>
            <text x="9" y="18" fill="#f43f5e" font-size="12">🗑️</text>
          </g>
        </g>
      </g>

      <!-- Item 2: Circuit Debugging -->
      <g id="CartItem-2" transform="translate(0, 126)">
        <rect width="372" height="110" rx="16" fill="#111827" stroke="#1f2937"/>
        
        <g transform="translate(16, 16)">
          <rect width="45" height="20" rx="6" fill="#0e7490"/>
          <text x="12" y="14" fill="#a5f3fc" class="font-sans" font-size="9" font-weight="800">ECE</text>
          <text x="56" y="14" fill="#94a3b8" class="font-sans" font-size="10">Technical</text>

          <text x="0" y="42" fill="#ffffff" class="font-display" font-size="14" font-weight="800">Circuit Debugging Master</text>
          
          <text x="0" y="68" fill="#10b981" class="font-sans" font-size="14" font-weight="800">₹100</text>
          <text x="46" y="67" fill="#64748b" class="font-sans" font-size="11">• March 25, 2026</text>

          <!-- Delete Trash Button -->
          <g transform="translate(305, 10)">
            <rect width="28" height="28" rx="6" fill="#1e293b"/>
            <text x="9" y="18" fill="#f43f5e" font-size="12">🗑️</text>
          </g>
        </g>
      </g>

      <!-- Bundle Discount Notice -->
      <g transform="translate(0, 252)">
        <rect width="372" height="40" rx="10" fill="#1e1b4b" stroke="#4338ca"/>
        <text x="14" y="25" fill="#a5b4fc" class="font-sans" font-size="11" font-weight="600">🎉 Multi-Event Pass: Free Lunch &amp; Fest T-Shirt Included!</text>
      </g>
    </g>

    <!-- DRAWER FOOTER: TOTAL & CHECKOUT -->
    <g transform="translate(0, 690)">
      <line x1="0" y1="0" x2="420" y2="0" stroke="#1f2937"/>
      <rect y="1" width="420" height="153" fill="#090d16"/>

      <g transform="translate(24, 20)">
        <text x="0" y="16" fill="#94a3b8" class="font-sans" font-size="12">Total Registration Fee</text>
        <text x="372" y="16" text-anchor="end" fill="#ffffff" class="font-display" font-size="24" font-weight="900">₹300</text>

        <!-- Buttons -->
        <g transform="translate(0, 36)">
          <rect width="80" height="46" rx="12" fill="#1e293b" stroke="#334155"/>
          <text x="40" y="28" text-anchor="middle" fill="#94a3b8" class="font-sans" font-size="12" font-weight="600">Clear</text>

          <rect x="92" width="280" height="46" rx="12" fill="url(#drawerBtn)"/>
          <text x="232" y="28" text-anchor="middle" fill="#ffffff" class="font-sans" font-size="14" font-weight="700">Proceed to Register (2) →</text>
        </g>
      </g>
    </g>
  </g>
</svg>
