<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#0a0f1d;">
  <defs>
    <linearGradient id="mHeroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="mBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .font-display { font-family: 'Outfit', 'Inter', system-ui, sans-serif; }
  </style>

  <!-- ================= STATUS BAR (iPhone 15) ================= -->
  <g id="StatusBar">
    <text x="32" y="32" fill="#ffffff" class="font-sans" font-size="14" font-weight="600">9:41</text>
    <!-- Dynamic Island Pill -->
    <rect x="135" y="12" width="120" height="30" rx="15" fill="#000000"/>
    <!-- Battery / Wifi icons -->
    <g transform="translate(325, 20)">
      <rect x="0" y="2" width="22" height="11" rx="3" fill="none" stroke="#ffffff" stroke-width="1"/>
      <rect x="2" y="4" width="14" height="7" rx="1.5" fill="#ffffff"/>
      <rect x="23" y="5" width="1.5" height="4" rx="0.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- ================= MOBILE HEADER ================= -->
  <g id="MobileNavbar" transform="translate(0, 54)">
    <rect width="390" height="56" fill="#0a0f1d" fill-opacity="0.9"/>
    <line x1="0" y1="56" x2="390" y2="56" stroke="#1f2937"/>

    <!-- Hamburger -->
    <g transform="translate(20, 18)" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="0" x2="20" y2="0"/>
      <line x1="0" y1="7" x2="15" y2="7"/>
      <line x1="0" y1="14" x2="20" y2="14"/>
    </g>

    <!-- Logo -->
    <g transform="translate(56, 12)">
      <rect width="32" height="32" rx="8" fill="#6366f1"/>
      <path d="M10 16 L16 10 L22 16 L16 22 Z" fill="#ffffff"/>
      <text x="40" y="22" fill="#ffffff" class="font-display" font-size="16" font-weight="900">KIOT FEST</text>
    </g>

    <!-- Cart Badge Button -->
    <g transform="translate(325, 12)">
      <rect width="42" height="32" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="12" y="21" fill="#cbd5e1" class="font-sans" font-size="12">🛒</text>
      <circle cx="34" cy="8" r="7" fill="#6366f1"/>
      <text x="31" y="11" fill="#ffffff" class="font-sans" font-size="9" font-weight="800">2</text>
    </g>
  </g>

  <!-- ================= MOBILE HERO ================= -->
  <g id="MobileHero" transform="translate(20, 126)">
    <!-- Pill -->
    <rect width="210" height="26" rx="13" fill="#1e1b4b" stroke="#4338ca"/>
    <text x="12" y="17" fill="#a5b4fc" class="font-sans" font-size="10" font-weight="700">✨ National Symposium 2026</text>

    <!-- Heading -->
    <text x="0" y="55" fill="#ffffff" class="font-display" font-size="28" font-weight="900" letter-spacing="-0.5">
      Unleash Innovation
    </text>
    <text x="0" y="88" fill="url(#mHeroGrad)" class="font-display" font-size="28" font-weight="900" letter-spacing="-0.5">
      at KIOT FEST 2026
    </text>

    <!-- Subtitle -->
    <text x="0" y="116" fill="#94a3b8" class="font-sans" font-size="12" leading="18">
      South India's flagship inter-college symposium.
    </text>
    <text x="0" y="134" fill="#fbbf24" class="font-sans" font-size="12" font-weight="700">
      🏆 ₹1,50,000 Total Cash Prize Pool
    </text>

    <!-- Search Input -->
    <g transform="translate(0, 150)">
      <rect width="350" height="42" rx="12" fill="#111827" stroke="#1f2937"/>
      <text x="14" y="26" fill="#64748b" class="font-sans" font-size="13">🔍 Search 20+ competitions...</text>
    </g>

    <!-- Horizontal Category Pills -->
    <g transform="translate(0, 204)">
      <rect x="0" width="55" height="32" rx="10" fill="#6366f1"/>
      <text x="16" y="20" fill="#ffffff" class="font-sans" font-size="11" font-weight="700">ALL</text>

      <rect x="63" width="55" height="32" rx="10" fill="#111827" stroke="#1f2937"/>
      <text x="78" y="20" fill="#94a3b8" class="font-sans" font-size="11" font-weight="600">CSE</text>

      <rect x="126" width="55" height="32" rx="10" fill="#111827" stroke="#1f2937"/>
      <text x="141" y="20" fill="#94a3b8" class="font-sans" font-size="11" font-weight="600">ECE</text>

      <rect x="189" width="65" height="32" rx="10" fill="#111827" stroke="#1f2937"/>
      <text x="202" y="20" fill="#94a3b8" class="font-sans" font-size="11" font-weight="600">AI&amp;DS</text>

      <rect x="262" width="65" height="32" rx="10" fill="#111827" stroke="#1f2937"/>
      <text x="275" y="20" fill="#94a3b8" class="font-sans" font-size="11" font-weight="600">MECH</text>
    </g>
  </g>

  <!-- ================= STACKED MOBILE CARD ================= -->
  <g id="MobileCard1" transform="translate(20, 380)">
    <rect width="350" height="360" rx="18" fill="#111827" stroke="#1f2937"/>

    <!-- Banner Image area -->
    <rect width="350" height="120" rx="18" fill="#1e1b4b"/>
    <rect x="14" y="12" width="50" height="22" rx="8" fill="#4338ca"/>
    <text x="26" y="27" fill="#c7d2fe" class="font-sans" font-size="10" font-weight="800">CSE</text>

    <!-- Seats Badge -->
    <rect x="14" y="88" width="105" height="20" rx="6" fill="#064e3b" stroke="#059669"/>
    <text x="22" y="102" fill="#6ee7b7" class="font-sans" font-size="10" font-weight="700">🟢 5 Seats Left</text>

    <!-- Details -->
    <text x="16" y="160" fill="#ffffff" class="font-display" font-size="16" font-weight="800">Web Hackathon 2026</text>
    <text x="16" y="182" fill="#94a3b8" class="font-sans" font-size="11">Build fullstack web applications in 6 hours.</text>
    <text x="16" y="210" fill="#cbd5e1" class="font-sans" font-size="11">📅 March 25, 2026  •  📍 CSE Lab 3</text>
    <text x="16" y="235" fill="#fbbf24" class="font-sans" font-size="13" font-weight="800">🏆 Prize: ₹15,000</text>

    <!-- Action Bar -->
    <line x1="16" y1="260" x2="334" y2="260" stroke="#1f2937"/>
    <text x="16" y="295" fill="#64748b" class="font-sans" font-size="10" font-weight="700">FEE</text>
    <text x="16" y="318" fill="#ffffff" class="font-display" font-size="18" font-weight="900">₹200</text>

    <rect x="210" y="285" width="124" height="42" rx="12" fill="url(#mBtnGrad)"/>
    <text x="238" y="311" fill="#ffffff" class="font-sans" font-size="13" font-weight="700">+ Register</text>
  </g>

  <!-- ================= BOTTOM NAVIGATION BAR ================= -->
  <g id="BottomNavBar" transform="translate(0, 770)">
    <rect width="390" height="74" fill="#0a0f1d" fill-opacity="0.95"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#1f2937"/>

    <!-- Home Tab -->
    <g transform="translate(40, 12)">
      <text x="12" y="20" text-anchor="middle" fill="#818cf8" font-size="18">🏠</text>
      <text x="12" y="36" text-anchor="middle" fill="#818cf8" class="font-sans" font-size="10" font-weight="700">Home</text>
    </g>

    <!-- Events Tab -->
    <g transform="translate(130, 12)">
      <text x="12" y="20" text-anchor="middle" fill="#94a3b8" font-size="18">⚡</text>
      <text x="12" y="36" text-anchor="middle" fill="#94a3b8" class="font-sans" font-size="10" font-weight="500">Events</text>
    </g>

    <!-- Passes Tab -->
    <g transform="translate(225, 12)">
      <text x="12" y="20" text-anchor="middle" fill="#94a3b8" font-size="18">🎟️</text>
      <text x="12" y="36" text-anchor="middle" fill="#94a3b8" class="font-sans" font-size="10" font-weight="500">Passes</text>
    </g>

    <!-- Cart Tab -->
    <g transform="translate(320, 12)">
      <text x="12" y="20" text-anchor="middle" fill="#94a3b8" font-size="18">🛒</text>
      <text x="12" y="36" text-anchor="middle" fill="#94a3b8" class="font-sans" font-size="10" font-weight="500">Cart (2)</text>
    </g>
  </g>
</svg>
